[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-thor-wuji-teleop"
version = "0.1.0"
description = "Quest 3 hand and wrist teleoperation for Thor and Wuji Hand 2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7", "hand-tracking-sdk==1.1.0"]

[project.optional-dependencies]
hand = ["scipy==1.15.3", "nlopt==2.11.0", "pin==4.1.0", "wuji-sdk==2026.9.22"]

[tool.setuptools.packages.find]
include = ["quest_teleop*"]

[tool.setuptools.package-data]
quest_teleop = ["hand/assets/*", "hand/vendor/wuji_retargeting/LICENSE"]
