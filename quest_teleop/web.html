<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quest Teleop</title>
<style>
:root{color-scheme:light;--bg:#f4f5f2;--ink:#172723;--muted:#687570;--line:#dde3dd;--green:#176b51}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1060px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:25px;margin:0}h2{font-size:17px;margin:0 0 18px}p{margin:7px 0;color:var(--muted)}
.pill{padding:5px 12px;border:1px solid var(--line);border-radius:24px;background:white;font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;color:var(--muted)}
select,input{display:block;width:100%;margin-top:5px;font:inherit;color:var(--ink);background:#fafbf9;border:1px solid var(--line);border-radius:8px;padding:9px;min-width:0}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:white;padding:9px 16px;cursor:pointer;color:var(--ink);font-weight:600}
button:hover{background:#edf2ed}button:disabled{opacity:.4;cursor:default}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#11543f}
.danger{color:#b63f36;border-color:#edccc8}.actions{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.note,summary{font-size:12px;color:var(--muted)}.note{margin-top:12px}details{margin-top:16px}summary{cursor:pointer}details .fields{margin-top:12px}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--ink)}.check input{width:auto;margin:0}
.timer{font-size:38px;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:10px 0}
.record-head{display:flex;align-items:center;justify-content:space-between}.record-head h2{margin:0}#recordState{font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;display:inline-block;border-radius:50%;background:#a5afaa;margin-right:7px}.dot.on{background:#1b9d6b}.dot.warn{background:#d29127}
.device{padding:12px 0;border-bottom:1px solid var(--line)}.device:last-of-type{border:0}.device>div{display:flex;justify-content:space-between;align-items:center;gap:12px}
.device small{display:block;color:var(--muted);font-size:12px;margin-top:4px;overflow-wrap:anywhere}.device b{font-size:13px}.device span{font-size:12px;text-align:right}
.error{border:1px solid #efc4bf;background:#fff0ed;color:#97352c;padding:12px 16px;border-radius:9px;margin-bottom:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.hidden{display:none!important}.list{max-height:240px;overflow:auto;margin-bottom:16px}.take{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:8px 0;font-weight:400}
.take.selected{border-color:var(--green);background:#eff7f1}.take strong{font-size:13px}.take small{display:block;color:var(--muted);font-size:12px}
progress{width:100%;height:6px;accent-color:var(--green)}footer{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}#busy,#playState{color:var(--muted);font-size:12px}
@media(max-width:720px){main{padding:20px 16px}.grid{grid-template-columns:1fr;gap:16px}.card{padding:18px}h1{font-size:22px}}
</style>
<main>
<header><h1>Quest Teleop</h1><span class="pill" id="sessionState">未启动</span></header>
<div id="error" class="error hidden" role="alert"></div>
<div class="grid">
<div class="card"><h2>实时控制</h2>
<div id="settings">
<div class="fields">
<label>设备<select id="only"><option value="both">手臂 + 灵巧手</option><option value="arm">仅手臂</option><option value="hand">仅灵巧手</option></select></label>
<label>控制侧<select id="side"><option value="right">右侧</option><option value="left">左侧</option><option value="both">左右双侧</option></select></label>
<label>Quest 连接<select id="transport"><option value="usb">USB</option><option value="udp">Wi-Fi</option></select></label>
</div>
<details><summary>更多设置</summary><div class="fields">
<label>串流端口<input id="port" type="number" min="1" max="65535" value="8000"></label>
<label>手臂平移比例<input id="scale" type="number" min="0.01" step="0.1" value="1"></label>
</div></details>
<label class="check"><input id="gesture" type="checkbox">✌ 手势开始遥操</label>
<p class="note">勾选后，点“启动”进入等待；所选侧任一只手保持 ✌ 约 0.7 秒，响一声后开始遥操。</p>
</div>
<div class="actions"><button class="primary" id="connect">启动</button><button class="danger" id="stop" disabled>停止全部</button><span id="busy"></span></div>
<p class="note" id="streamHint">Quest：TCP / 127.0.0.1 / 8000</p>
</div>
<div class="card"><h2>设备状态</h2>
<div class="device" id="quest"><div><b>Quest</b><span>未启动</span></div><small></small></div>
<div class="device hidden" id="thor"><div><b>Thor 手臂</b><span></span></div><small></small></div>
<div class="device hidden" id="handLeft"><div><b>Wuji 左手</b><span></span></div><small></small></div>
<div class="device hidden" id="handRight"><div><b>Wuji 右手</b><span></span></div><small></small></div>
<p class="note" id="deviceNote">启动后显示连接状态。</p>
</div>
<div class="card"><div class="record-head"><h2>采集</h2><span id="recordState">待命</span></div>
<div class="timer" id="elapsed">00:00.0</div>
<div class="actions"><button class="primary" id="record" disabled>开始采集</button><button id="endRecord" disabled>结束采集</button></div>
<p class="note">点“开始采集”录制动作，点“结束采集”保存；结束采集后遥操继续。</p>
</div>
<div class="card"><h2>回放</h2><div class="list" id="takes"><p>还没有录制动作。</p></div>
<div class="fields">
<label>速度<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
</div>
<div class="actions"><button class="primary" id="replay" disabled>回放到机器人</button><span id="playState"></span></div>
<progress id="progress" class="hidden" max="1" value="0"></progress>
<p class="note">回放会驱动所选录制对应的设备，无需 Quest；手臂从当前位置复现相对动作。</p>
</div>
</div>
<footer>关闭网页不会停止运行。请点“停止全部”，或在终端按 Ctrl+C。</footer>
</main>
<script>
const $ = id => document.getElementById(id);
let current = null, takes = [], selected = null, initialized = false, pending = false, lastList = 0;
let audio = null;
function enableSound() {
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (Audio) { audio ||= new Audio(); audio.resume().catch(() => {}); }
}
function startSound() {
  if (!audio || audio.state !== 'running') return;
  const tone = audio.createOscillator(), gain = audio.createGain(), t = audio.currentTime;
  tone.frequency.value = 880;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(.12, t + .01);
  gain.gain.exponentialRampToValueAtTime(.001, t + .18);
  tone.connect(gain); gain.connect(audio.destination);
  tone.start(t); tone.stop(t + .2);
  tone.onended = () => { tone.disconnect(); gain.disconnect(); };
}
const timecode = s => {
  s = Math.max(0, s || 0);
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(1).padStart(4, '0')}`;
};
const labels = {both: '手臂 + 灵巧手', arm: '手臂', hand: '灵巧手', left: '左侧', right: '右侧'};
function error(message) {
  $('error').textContent = message || '';
  $('error').classList.toggle('hidden', !message);
}
async function api(path, body) {
  const response = await fetch('/api/' + path, body === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  const value = await response.json();
  if (!response.ok) throw Error(value.error || response.statusText);
  return value;
}
async function action(path, body = {}) {
  if (pending) return;
  pending = true;
  $('busy').textContent = '处理中…';
  error('');
  try { render(await api(path, body)); await refreshTakes(); }
  catch (e) { error(e.message); }
  finally { pending = false; $('busy').textContent = ''; }
}
function device(id, text, detail, good = false) {
  const root = $(id), span = root.querySelector('span'), dot = document.createElement('i');
  dot.className = 'dot' + (good ? ' on' : current.active ? ' warn' : '');
  span.replaceChildren(dot, document.createTextNode(text));
  root.querySelector('small').textContent = detail || '';
}
function streamHint() {
  $('streamHint').textContent = `Quest：${$('transport').value === 'usb' ? 'TCP / 127.0.0.1' : 'UDP / 电脑 Wi-Fi IP'} / ${$('port').value}；开启 Head Pose、Debug Info，关闭 Video Feed。`;
}
function renderDevices(s) {
  const active = s.active, replaying = active && s.mode === 'replay';
  const sides = s.options.side === 'both' ? ['left', 'right'] : [s.options.side];
  const controlling = active;
  $('quest').classList.toggle('hidden', replaying);
  const tracking = sides.map(side => {
    const prefix = side === 'left' ? 'Left' : 'Right', ages = s.quest.ages;
    const valid = ages[prefix + '/landmarks'] < .2 && (s.options.only === 'hand' || ages[prefix + '/wrist'] < .2);
    return `${side === 'left' ? '左手' : '右手'}${valid ? '已识别' : '未识别'}`;
  });
  device('quest', !active ? '未启动' : s.quest.live ? '已接收' : '等待串流', active ? tracking.join(' · ') : '', s.quest.live);
  $('thor').classList.toggle('hidden', !controlling || s.options.only === 'hand');
  const a = s.arms, fresh = a?.fresh;
  const armStates = sides.map(side => a?.sides?.[side]);
  const following = fresh && a.prepared && armStates.every(state => state?.calibrated && !state.paused);
  const armText = s.waiting_for_gesture ? '等待 ✌ 手势' : !fresh ? '等待启动' : !a.connected ? '等待连接' : !a.prepared ? '等待控制模式' : following ? '跟随中' : '等待输入';
  device('thor', armText, s.options.side === 'both' ? '左右双臂' : `${labels[s.options.side]}手臂`, following);
  const phases = {initializing: '正在连接', awaiting_input: '等待输入', enabling: '正在使能', running: '跟随中', paused: '暂停', rebasing: '重新对齐', stopped: '已停止'};
  for (const side of ['left', 'right']) {
    const id = side === 'left' ? 'handLeft' : 'handRight', h = s.hands[side];
    $(id).classList.toggle('hidden', !controlling || s.options.only === 'arm' || !sides.includes(side));
    device(id, s.waiting_for_gesture ? '等待 ✌ 手势' : h?.fresh ? phases[h.phase] || '等待输入' : '等待启动', h?.fresh ? h.diagnosis : '', h?.fresh && h.connected);
  }
  $('deviceNote').textContent = !active ? '启动后显示连接状态。' : s.waiting_for_gesture ? '已进入等待，识别到 ✌ 后启动所选设备。' : '';
}
function render(s) {
  if (s.active && !s.stopping && s.mode === 'live' && current?.waiting_for_gesture && !s.waiting_for_gesture) startSound();
  current = s;
  $('gesture').checked = s.gesture_enabled;
  if (!initialized || s.active) {
    for (const key of ['only', 'side', 'transport', 'scale']) $(key).value = s.options[key];
    $('port').value = s.options.port || (s.options.transport === 'usb' ? 8000 : 9000);
    initialized = true;
    streamHint();
  }
  const active = s.active, rec = s.recording, playing = active && s.mode === 'replay';
  document.querySelectorAll('#settings input,#settings select').forEach(e => e.disabled = active);
  $('connect').disabled = active;
  $('stop').disabled = !active || s.stopping;
  $('record').disabled = !active || s.mode !== 'live' || rec.active || s.stopping || s.waiting_for_gesture || !s.quest.live;
  $('endRecord').disabled = !rec.active;
  $('replay').disabled = active || !selected;
  $('speed').disabled = active;
  $('sessionState').textContent = s.stopping ? '停止中' : !active ? '未启动' : playing ? '回放中' : s.waiting_for_gesture ? '等待 ✌ 手势' : rec.active ? '遥操 + 录制中' : '遥操中';
  $('elapsed').textContent = timecode(rec.active ? rec.elapsed_s : rec.last?.elapsed_s);
  $('recordState').textContent = rec.active ? '● 采集中' : rec.last?.frames ? '已保存' : '待命';
  renderDevices(s);
  const rp = s.replay;
  $('playState').textContent = playing ? rp?.phase === 'preparing' ? '等待设备就绪…' : `回放 ${timecode(rp?.position_s)}` : rp?.phase === 'complete' ? '回放完成' : '';
  $('progress').classList.toggle('hidden', !playing);
  const take = takes.find(t => t.id === selected);
  $('progress').value = take?.duration_s ? Math.min(1, (rp?.position_s || 0) / take.duration_s) : 0;
  if (s.error) error(s.error);
}
async function refreshTakes() {
  takes = await api('recordings');
  if (!selected && takes.length) selected = takes[0].id;
  const list = $('takes');
  list.replaceChildren();
  if (!takes.length) {
    const p = document.createElement('p');
    p.textContent = '还没有录制动作。';
    list.append(p);
  }
  for (const t of takes) {
    const row = document.createElement('button'), name = document.createElement('strong'), detail = document.createElement('small');
    row.className = 'take' + (selected === t.id ? ' selected' : '');
    row.setAttribute('aria-pressed', selected === t.id);
    name.textContent = t.created;
    detail.textContent = `${timecode(t.duration_s)} · ${t.config.side === 'both' ? '双侧' : labels[t.config.side]} ${labels[t.config.only]}`;
    row.append(name, detail);
    row.onclick = () => { selected = t.id; refreshTakes().catch(e => error(e.message)); };
    list.append(row);
  }
  if (current) $('replay').disabled = current.active || !selected;
}
$('transport').onchange = () => { $('port').value = $('transport').value === 'usb' ? 8000 : 9000; streamHint(); };
$('port').oninput = streamHint;
$('connect').onclick = () => { enableSound(); return action('start', {
  only: $('only').value, side: $('side').value, transport: $('transport').value,
  port: Number($('port').value), scale: Number($('scale').value)
}); };
$('stop').onclick = () => action('stop');
$('record').onclick = () => { enableSound(); return action('record/start'); };
$('endRecord').onclick = () => action('record/stop');
$('gesture').onchange = () => { enableSound(); return action('teleop/gesture', {enabled: $('gesture').checked}); };
$('replay').onclick = () => action('replay', {id: selected, speed: Number($('speed').value)});
async function poll() {
  try {
    render(await api('status'));
    if (Date.now() - lastList > 2500) { lastList = Date.now(); await refreshTakes(); }
  } catch (e) { error('网页服务暂不可用：' + e.message); }
  setTimeout(poll, 500);
}
poll();
</script>
</html>
